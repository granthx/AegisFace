<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Rounded Aesthetic Dark Background -->
  <rect width="240" height="240" rx="52" fill="#18181B" />
  
  <!-- Outer Subtle Tech Border -->
  <rect x="4" y="4" width="232" height="232" rx="48" stroke="#3B5998" stroke-width="2.5" stroke-dasharray="6 4" stroke-opacity="0.6" fill="none" />

  <!-- +30% Forensic Margin Box -->
  <rect x="48" y="32" width="144" height="176" stroke="#3B5998" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.8" />
  <text x="52" y="46" fill="#3B5998" font-size="9" font-family="Courier New, monospace" font-weight="bold">+30% MARGIN</text>

  <!-- Human Suspect Face Contour -->
  <path d="M70 120 C70 60, 170 60, 170 120 C170 175, 145 205, 120 205 C95 205, 70 175, 70 120 Z" fill="#E9E1D4" />
  
  <!-- Hairline / Silhouette Shadow -->
  <path d="M60 105 C65 50, 175 50, 180 105 C160 65, 80 65, 60 105 Z" fill="#252525" />
  
  <!-- Biometric Landmark Traces -->
  <path d="M74 135 C75 170, 95 198, 120 198 C145 198, 165 170, 166 135" stroke="#B5A642" stroke-width="2" stroke-dasharray="3 3" fill="none" />

  <!-- Eyes & Pupils -->
  <ellipse cx="98" cy="115" rx="12" ry="7" fill="#2E2E2E" />
  <ellipse cx="142" cy="115" rx="12" ry="7" fill="#2E2E2E" />
  <circle cx="98" cy="115" r="4" fill="#E9E1D4" />
  <circle cx="142" cy="115" r="4" fill="#E9E1D4" />
  <circle cx="144" cy="113" r="1.5" fill="#B5A642" />

  <!-- Forensic Nose & Mouth -->
  <path d="M120 122 L115 148 L125 148" stroke="#7A7A7A" stroke-width="2.5" stroke-linecap="round" />
  <path d="M102 168 Q120 180 138 168" stroke="#8C2727" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Grad-CAM Thermal Activation Maps (Eyes + Perioral/Jaw Artifacts) -->
  <g opacity="0.82" style="mix-blend-mode: screen;">
    <circle cx="98" cy="115" r="28" fill="url(#favCamEye)" />
    <circle cx="142" cy="115" r="30" fill="url(#favCamEye)" />
    <ellipse cx="120" cy="175" rx="44" ry="30" fill="url(#favCamJaw)" />
    <ellipse cx="78" cy="150" rx="22" ry="32" fill="url(#favCamJaw)" />
    <ellipse cx="162" cy="150" rx="22" ry="32" fill="url(#favCamJaw)" />
  </g>

  <!-- Corner Tech Accent Dots -->
  <circle cx="28" cy="28" r="4" fill="#B5A642" />
  <circle cx="212" cy="28" r="4" fill="#B5A642" />
  <circle cx="28" cy="212" r="4" fill="#3B5998" />
  <circle cx="212" cy="212" r="4" fill="#3B5998" />

  <!-- Gradient Definitions -->
  <defs>
    <radialGradient id="favCamEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E1E" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FFA800" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#FFDD00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="favCamJaw" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0A0A" stop-opacity="0.98" />
      <stop offset="40%" stop-color="#FF7A00" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#FFD000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>
